name: Refresh Yahoo price history
on:
  workflow_dispatch:
    inputs:
      tools:
        description: "Tools to refresh: backtest, investment, crash, or all"
        required: true
        default: all
        type: string
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fintools
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Retrieve selected Yahoo daily history
        run: python scripts/refresh_yahoo_history.py --tools "${{ inputs.tools }}"
      - name: Commit updated JSON histories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No changes to price histories."
          else
            git commit -m "Refresh selected Yahoo Finance histories"
            git push
          fi
