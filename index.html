<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fintools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10243a;
    --ink-soft: #4b5f75;
    --paper: #eaf0f6;
    --card: #ffffff;
    --line: #d5dfea;
    --teal: #0b8a8f;
    --teal-soft: #d9f0f0;
    --amber: #e8a02e;
    --amber-soft: #fbeccd;
    --display: "Sora", "Segoe UI", system-ui, sans-serif;
    --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8eff6; --ink-soft: #a3b4c6; --paper: #0a1522; --card: #15283d; --line: #263d56;
      --teal: #38c3c8; --teal-soft: #11383f; --amber: #f2b552; --amber-soft: #3b2f17;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; font-family: var(--body); font-size: 17px; line-height: 1.55;
    color: var(--ink); background: var(--paper);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; border-radius: 6px; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; color: #eef5fb;
    background: radial-gradient(1200px 500px at 80% 40%, #0f5d73 0%, transparent 60%),
                linear-gradient(135deg, #0b1d31 0%, #11365a 70%, #0a4d5c 100%);
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(2px); pointer-events: none; will-change: transform; }
  .orb.o1 { width: 220px; height: 220px; left: 6%; top: 22%; background: radial-gradient(circle at 30% 30%, rgba(127,227,230,.35), rgba(127,227,230,0) 70%); }
  .orb.o2 { width: 120px; height: 120px; right: 12%; top: 12%; background: radial-gradient(circle at 30% 30%, rgba(232,160,46,.5), rgba(232,160,46,0) 70%); }
  .orb.o3 { width: 70px; height: 70px; left: 46%; bottom: 14%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.4), rgba(255,255,255,0) 70%); }

  .hero-inner { position: relative; max-width: 1080px; margin: 0 auto; padding: 28px 24px 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 30; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
  .brand svg { width: 30px; height: 30px; }

  /* Settings */
  .settings { position: relative; }
  .icon-btn {
    display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff;
    cursor: pointer; transition: background .2s; backdrop-filter: blur(6px);
  }
  .icon-btn:hover, .icon-btn[aria-expanded="true"] { background: rgba(255,255,255,.22); }
  .icon-btn svg { width: 22px; height: 22px; transition: transform .35s; }
  .icon-btn[aria-expanded="true"] svg { transform: rotate(60deg); }
  .menu {
    position: absolute; right: 0; top: calc(100% + 10px); min-width: 260px;
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.3); padding: 8px; z-index: 40;
    transform-origin: top right; animation: pop .16s ease-out;
  }
  .menu[hidden] { display: none; }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
  .menu-title { margin: 6px 10px; font-size: .85rem; color: var(--ink-soft); font-weight: 600; }
  .menu a { display: flex; gap: 12px; align-items: flex-start; padding: 10px; border-radius: 10px; text-decoration: none; color: inherit; }
  .menu a:hover, .menu a:focus-visible { background: var(--teal-soft); }
  .m-ico { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); }
  .m-ico svg { width: 18px; height: 18px; }
  .menu strong { display: block; font-weight: 600; line-height: 1.25; }
  .menu small { color: var(--ink-soft); font-size: .88rem; line-height: 1.3; display: block; }

  .hero-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 8px; align-items: center; min-height: 380px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2.4rem, 6vw, 3.8rem); line-height: 1.05; margin: 0 0 14px; letter-spacing: -.02em; text-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .lede { margin: 0; max-width: 32ch; font-size: 1.15rem; color: #c3d5e6; }

  /* 3D bar scene */
  .stage-wrap { position: relative; height: 380px; perspective: 1100px; }
  .stage {
    position: absolute; left: 50%; top: 58%; width: 0; height: 0;
    transform-style: preserve-3d;
    transform: rotateX(var(--tx, 58deg)) rotateZ(var(--tz, 38deg)) scale(var(--sc, 1));
  }
  .floor {
    position: absolute; left: -160px; top: -135px; width: 320px; height: 270px; border-radius: 16px;
    background-color: rgba(127,227,230,.07);
    background-image: linear-gradient(rgba(127,227,230,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(127,227,230,.22) 1px, transparent 1px);
    background-size: 22px 22px;
    border: 1px solid rgba(127,227,230,.35);
    transform: translateZ(-2px);
    box-shadow: 0 0 60px rgba(0,0,0,.45);
  }
  .bar { position: absolute; width: 34px; height: 34px; transform-style: preserve-3d; }
  .bar i { position: absolute; display: block; }
  .bar .t { left: 0; top: 0; width: 34px; height: 34px; transform: translateZ(var(--h)); background: var(--ct); }
  .bar .f { left: 0; top: 34px; width: 34px; height: var(--h); transform-origin: 0 0; transform: rotateX(90deg); background: var(--cf); }
  .bar .r { left: 34px; top: 0; width: 34px; height: var(--h); transform-origin: 0 0; transform: rotateZ(90deg) rotateX(90deg); background: var(--cr); }
  .bar.teal  { --ct: #6fdde0; --cf: #2ba7ad; --cr: #176f77; }
  .bar.amber { --ct: #ffd681; --cf: #eaa83a; --cr: #b2741a; }

  /* ---------- Tools ---------- */
  main { max-width: 1080px; margin: 0 auto; padding: 40px 24px 56px; }
  .list-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 24px; }
  .list-head h2 { margin: 0; font-family: var(--display); font-size: 1.4rem; letter-spacing: -.01em; }
  .count { color: var(--ink-soft); font-size: .95rem; }
  .search { display: none; position: relative; }
  .search.on { display: block; }
  .search input { width: min(100%, 280px); font: inherit; padding: 10px 14px 10px 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-soft); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px; perspective: 1200px; }
  .tool {
    position: relative; display: flex; flex-direction: column; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale3d(var(--s, 1), var(--s, 1), 1);
    transition: transform .18s ease-out, box-shadow .25s;
    box-shadow: 0 1px 0 var(--line), 0 6px 0 -1px var(--line), 0 18px 30px rgba(16,36,58,.14);
    will-change: transform;
  }
  .tool.live { box-shadow: 0 1px 0 var(--line), 0 8px 0 -1px var(--line), 0 30px 44px rgba(16,36,58,.24); }
  .tool::after { /* moving light */
    content: ""; position: absolute; inset: 0; border-radius: 20px; pointer-events: none;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.35), transparent 55%);
    opacity: 0; transition: opacity .25s; transform: translateZ(1px);
  }
  .tool.live::after { opacity: 1; }
  .art { background: var(--teal-soft); padding: 16px 18px 6px; border-radius: 19px 19px 0 0; transform-style: preserve-3d; }
  .art.amber { background: var(--amber-soft); }
  .art svg { display: block; width: 100%; height: 100px; transform: translateZ(42px); filter: drop-shadow(0 14px 8px rgba(16,36,58,.28)); animation: bob 4.5s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateZ(42px) translateY(0); } to { transform: translateZ(54px) translateY(-5px); } }
  .tool-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; transform-style: preserve-3d; }
  .tag { align-self: flex-start; font-size: .82rem; font-weight: 600; padding: 2px 10px; border-radius: 99px; background: var(--teal-soft); color: var(--teal); transform: translateZ(34px); }
  .tag.amber { background: var(--amber-soft); color: #9a6410; }
  @media (prefers-color-scheme: dark) { .tag.amber { color: var(--amber); } }
  .tool h3 { margin: 0; font-family: var(--display); font-size: 1.18rem; line-height: 1.25; transform: translateZ(28px); }
  .tool p { margin: 0; color: var(--ink-soft); transform: translateZ(18px); }
  .open { margin-top: auto; padding-top: 8px; font-weight: 600; color: var(--teal); display: inline-flex; align-items: center; gap: 6px; transform: translateZ(24px); }
  .open svg { width: 16px; height: 16px; transition: transform .2s; }
  .tool:hover .open svg { transform: translateX(4px); }
  .empty { grid-column: 1 / -1; padding: 32px; text-align: center; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 18px; }

  footer { max-width: 1080px; margin: 0 auto; padding: 0 24px 40px; color: var(--ink-soft); font-size: .92rem; }

  @media (max-width: 760px) {
    .hero-grid { grid-template-columns: 1fr; min-height: 0; }
    .stage-wrap { height: 300px; }
    .stage { --sc: .8; top: 55%; }
    h1 { margin-top: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .art svg { animation: none; }
    .menu { animation: none; }
    .tool { transition: none; }
  }
</style>
</head>
<body>

<header class="hero" id="hero">
  <div class="orb o1" data-depth="18"></div>
  <div class="orb o2" data-depth="34"></div>
  <div class="orb o3" data-depth="52"></div>
  <div class="hero-inner">
    <div class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#e8a02e"/><path d="M6 22l7-7 5 4 8-9" fill="none" stroke="#10243a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Fintools
      </div>
      <div class="settings">
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="menu" id="settingsMenu" role="menu" hidden></div>
      </div>
    </div>

    <div class="hero-grid">
      <div>
        <h1>Fintools</h1>
        <p class="lede">Historical market tools powered by Yahoo Finance daily prices.</p>
      </div>
      <div class="stage-wrap" aria-hidden="true">
        <div class="stage" id="stage"><div class="floor"></div></div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="list-head">
    <div>
      <h2>Tools</h2>
      <div class="count" id="count"></div>
    </div>
    <label class="search" id="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search tools" aria-label="Search tools">
    </label>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>Prices are historical and for learning only. They are not financial advice.</footer>

<script>
/* =====================================================================
   HOW TO ADD A NEW TOOL
   Copy one block inside TOOLS, then change the text and the link.
     title : name shown on the card
     desc  : one short sentence
     url   : page to open
     tag   : small label (e.g. "Compare", "Simulate")
     art   : picture on the card. Choose one of:
             "compare" | "growth" | "drawdown" | "candles"
     tone  : "teal" or "amber" (card colour)
   The search box appears on its own once you have more than 6 tools.
   ===================================================================== */
const TOOLS = [
  {
    title: "Backtesting",
    desc: "Compare long-term performance.",
    url: "https://sgkjeajk.github.io/fintools/Tool_Back_testing.html",
    tag: "Compare", art: "compare", tone: "teal"
  },
  {
    title: "Investment simulator",
    desc: "Explore index investing scenarios.",
    url: "https://sgkjeajk.github.io/fintools/Tool_investment-simulator.html",
    tag: "Simulate", art: "growth", tone: "amber"
  },
  {
    title: "Crash buying simulator",
    desc: "Explore DBS and OCBC historical drawdowns.",
    url: "https://sgkjeajk.github.io/fintools/Tool_crash_buying_simulator_dbs_ocbc.html",
    tag: "Simulate", art: "drawdown", tone: "teal"
  }
  // ← add new tools here
];

/* Settings menu items. Add more here later. */
const SETTINGS = [
  {
    title: "Refresh price history",
    desc: "Opens the admin page to update prices.",
    url: "https://sgkjeajk.github.io/fintools/admin.html",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>'
  }
];

const ART = {
  compare: (c1, c2) => `<svg viewBox="0 0 240 96" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 78 L40 66 L80 70 L120 52 L160 44 L200 30 L240 14" fill="none" stroke="${c1}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 80 L40 74 L80 76 L120 66 L160 62 L200 54 L240 48" fill="none" stroke="${c2}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8"/>
  </svg>`,
  growth: (c1, c2) => `<svg viewBox="0 0 240 96" preserveAspectRatio="none" aria-hidden="true">
    ${[0,1,2,3,4,5,6,7].map(i => `<rect x="${10+i*28}" y="${86-(12+i*9)}" width="18" height="${12+i*9}" rx="4" fill="${c1}" opacity="${.45+i*.07}"/>`).join("")}
    <path d="M19 70 L75 56 L131 40 L187 26 L231 10" fill="none" stroke="${c2}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`,
  drawdown: (c1, c2) => `<svg viewBox="0 0 240 96" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 24 L50 18 L90 22 L120 70 L150 58 L190 38 L240 20" fill="none" stroke="${c1}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 22 L120 22 L120 70" fill="none" stroke="${c2}" stroke-width="2.5" stroke-dasharray="4 5" stroke-linecap="round"/>
    <circle cx="120" cy="70" r="7" fill="${c2}"/>
  </svg>`,
  candles: (c1, c2) => `<svg viewBox="0 0 240 96" preserveAspectRatio="none" aria-hidden="true">
    ${[[20,50,30,1],[55,40,34,0],[90,44,26,1],[125,30,36,1],[160,36,28,0],[195,22,34,1]].map(([x,y,h,up]) => `<line x1="${x+7}" y1="${y-8}" x2="${x+7}" y2="${y+h+8}" stroke="${up?c1:c2}" stroke-width="2.5" stroke-linecap="round"/><rect x="${x}" y="${y}" width="14" height="${h}" rx="3" fill="${up?c1:c2}"/>`).join("")}
  </svg>`
};
const COLORS = { teal: ["#0b8a8f", "#e8a02e"], amber: ["#d98a12", "#0b8a8f"] };
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const grid = document.getElementById("grid");
const countEl = document.getElementById("count");
const searchEl = document.getElementById("search");
const qEl = document.getElementById("q");
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

function render() {
  const q = qEl.value.trim().toLowerCase();
  const shown = TOOLS.filter(t => (t.title + " " + t.desc + " " + (t.tag || "")).toLowerCase().includes(q));
  grid.innerHTML = shown.length ? shown.map(t => {
    const tone = t.tone === "amber" ? "amber" : "teal";
    const [c1, c2] = COLORS[tone];
    const art = (ART[t.art] || ART.candles)(c1, c2);
    return `<a class="tool" href="${esc(t.url)}">
      <div class="art ${tone}">${art}</div>
      <div class="tool-body">
        ${t.tag ? `<span class="tag ${tone}">${esc(t.tag)}</span>` : ""}
        <h3>${esc(t.title)}</h3>
        <p>${esc(t.desc)}</p>
        <span class="open">Open tool ${ARROW}</span>
      </div>
    </a>`;
  }).join("") : `<div class="empty">No tools match “${esc(qEl.value)}”. Try a different word.</div>`;
  countEl.textContent = TOOLS.length === 1 ? "1 tool" : TOOLS.length + " tools";
  searchEl.classList.toggle("on", TOOLS.length > 6);
}
qEl.addEventListener("input", render);
render();

/* Card tilt: follows finger or mouse. Works for cards added later too. */
grid.addEventListener("pointermove", e => {
  if (REDUCED) return;
  const card = e.target.closest(".tool");
  if (!card) return;
  const r = card.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top) / r.height;
  card.style.setProperty("--ry", ((x - .5) * 16).toFixed(2) + "deg");
  card.style.setProperty("--rx", ((.5 - y) * 14).toFixed(2) + "deg");
  card.style.setProperty("--s", "1.03");
  card.style.setProperty("--mx", (x * 100).toFixed(0) + "%");
  card.style.setProperty("--my", (y * 100).toFixed(0) + "%");
  card.classList.add("live");
});
function resetCard(e) {
  const card = e.target.closest && e.target.closest(".tool");
  if (!card) return;
  ["--rx", "--ry", "--s"].forEach(p => card.style.removeProperty(p));
  card.classList.remove("live");
}
grid.addEventListener("pointerout", e => { if (!e.relatedTarget || !e.target.closest(".tool") || !e.target.closest(".tool").contains(e.relatedTarget)) resetCard(e); });
grid.addEventListener("pointercancel", resetCard);

/* Settings menu */
const btn = document.getElementById("settingsBtn");
const menu = document.getElementById("settingsMenu");
menu.innerHTML = '<div class="menu-title">Settings</div>' + SETTINGS.map(s =>
  `<a role="menuitem" href="${esc(s.url)}"><span class="m-ico">${s.icon}</span><span><strong>${esc(s.title)}</strong><small>${esc(s.desc)}</small></span></a>`
).join("");
function setMenu(open) { menu.hidden = !open; btn.setAttribute("aria-expanded", String(open)); }
btn.addEventListener("click", e => { e.stopPropagation(); setMenu(menu.hidden); });
document.addEventListener("click", e => { if (!menu.contains(e.target)) setMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { setMenu(false); btn.focus(); } });

/* 3D hero: bars rise, move like a live market, and the scene follows your pointer */
const COLS = 6, ROWS = 5, PITCH = 44;
const stage = document.getElementById("stage");
const bars = [];
for (let i = 0; i < COLS; i++) {
  for (let j = 0; j < ROWS; j++) {
    const el = document.createElement("div");
    el.className = "bar " + ((i === 5 && j === 2) || (i === 3 && j === 4) ? "amber" : "teal");
    el.style.left = (-127 + i * PITCH) + "px";
    el.style.top = (-105 + j * PITCH) + "px";
    el.innerHTML = "<i class='t'></i><i class='f'></i><i class='r'></i>";
    stage.appendChild(el);
    bars.push({ el, i, j });
  }
}
const hero = document.getElementById("hero");
const orbs = [...hero.querySelectorAll(".orb")];
let nx = 0, ny = 0, cx = 0, cy = 0;
hero.addEventListener("pointermove", e => {
  const r = hero.getBoundingClientRect();
  nx = (e.clientX - r.left) / r.width - .5;
  ny = (e.clientY - r.top) / r.height - .5;
});
hero.addEventListener("pointerleave", () => { nx = 0; ny = 0; });

function frame(ms) {
  const t = ms / 1000;
  const grow = REDUCED ? 1 : Math.min(1, t / 1.8);
  const g = 1 - Math.pow(1 - grow, 3);
  for (const b of bars) {
    const base = 14 + b.i * 11 + b.j * 3;
    const wave = REDUCED ? 0 : Math.sin(t * .9 + b.i * .8 + b.j * .5) * 9 + Math.sin(t * .37 + b.i * 1.7) * 6;
    b.el.style.setProperty("--h", Math.max(6, (base + wave) * g).toFixed(1) + "px");
  }
  cx += (nx - cx) * .06; cy += (ny - cy) * .06;
  const spin = REDUCED ? 0 : Math.sin(t * .35) * 4;
  stage.style.setProperty("--tz", (38 + cx * 22 + spin).toFixed(2) + "deg");
  stage.style.setProperty("--tx", (58 - cy * 10).toFixed(2) + "deg");
  for (const o of orbs) {
    const d = +o.dataset.depth;
    o.style.transform = `translate(${(-cx * d).toFixed(1)}px, ${(-cy * d).toFixed(1)}px)`;
  }
  if (!REDUCED) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
